<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Il Do 22026 Friendship Tournament Announcements</title>
  <!-- Tailwind CSS CDN for styling -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-slate-900 text-white shadow-md border-b-4 border-red-600">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl sm:text-2xl font-black tracking-wider uppercase flex items-center gap-2">
        <span>🥋</span> Il Do 22026 Friendship Tournament Announcements
      </h1>
      <button id="auth-btn" onclick="toggleAuthModal()" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-md font-semibold text-xs sm:text-sm transition">
        Admin Login
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl w-full mx-auto p-4 flex-grow flex flex-col gap-4">

    <!-- Controls Bar -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-3">
      <label class="inline-flex items-center gap-3 cursor-pointer select-none">
        <input type="checkbox" id="audio-toggle" onchange="toggleAudioPref(this.checked)" class="sr-only peer">
        <div class="relative w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-red-600"></div>
        <span class="font-bold text-sm sm:text-base text-slate-700 flex items-center gap-1.5">
          <span>🔔</span> Audio Alerts Enabled
        </span>
      </label>

      <div id="admin-badge" class="hidden items-center gap-2 bg-red-100 text-red-800 px-3 py-1 rounded-full font-bold text-xs">
        <span class="w-2 h-2 rounded-full bg-red-600 animate-pulse"></span> Admin Mode
      </div>
    </div>

    <!-- Admin Announcement Form (Hidden by default) -->
    <div id="admin-form-container" class="hidden bg-white p-5 rounded-xl shadow-md border-l-4 border-red-600 mb-2">
      <h2 id="form-title" class="text-lg font-bold mb-3 text-slate-900">Post New Announcement</h2>
      <input type="hidden" id="edit-id" value="">
      
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Title / Ring Info</label>
          <input type="text" id="input-title" placeholder="e.g., Ring 2 - Heavyweight Sparring" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Details</label>
          <textarea id="input-body" rows="3" placeholder="e.g., Calling Divisions 18-20 to staging area..." class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none"></textarea>
        </div>
        <div class="flex gap-2">
          <button onclick="submitNotification()" class="bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-2 rounded-lg text-sm transition">
            Publish
          </button>
          <button id="cancel-edit-btn" onclick="resetForm()" class="hidden bg-slate-500 hover:bg-slate-600 text-white font-bold px-4 py-2 rounded-lg text-sm transition">
            Cancel Edit
          </button>
        </div>
      </div>
    </div>

    <!-- Scrollable Feed -->
    <div class="flex-grow flex flex-col">
      <div class="flex justify-between items-center mb-2">
        <h2 class="text-md font-bold uppercase text-slate-500 tracking-wider">Live Announcements</h2>
        <span id="last-sync" class="text-xs text-slate-400">Syncing...</span>
      </div>
      <div id="feed-scroll" class="overflow-y-auto max-h-[60vh] pr-1 space-y-3">
        <!-- Dynamic Cards render here -->
      </div>
    </div>
  </main>

  <!-- Login Modal -->
  <div id="login-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex justify-center items-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl p-6 w-full max-w-sm">
      <h3 class="text-lg font-bold mb-4">Admin Authentication</h3>
      <input type="password" id="admin-password" placeholder="Enter Admin Password" class="w-full p-2.5 border border-slate-300 rounded-lg mb-4 focus:ring-2 focus:ring-red-500 focus:outline-none">
      <div class="flex justify-end gap-2">
        <button onclick="toggleAuthModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 rounded-lg text-sm font-semibold">Cancel</button>
        <button onclick="loginAdmin()" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-sm font-semibold">Login</button>
      </div>
    </div>
  </div>

  <script>
    // --- APP CONFIGURATION ---
    // Passwords & API settings (Default JSONBin demo endpoint configured)
    const ADMIN_PASSWORD = "tkd2026"; 
    
    // Configured for JSONBin.io V3 Public Storage API
    const BIN_ID = "6aa30ec9ac6210605abe1147"; // Replace with your own Bin ID if hosting permanently
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
    const X_MASTER_KEY = "$2a$10$NrzeLEftdEjHj8T/bpGNr.hOqJZ.U61NSqg3vscdE.m5hRtYnbAH."; // ${X_Master_key}

    // --- APP STATE ---
    let isAdmin = localStorage.getItem('tkd_admin_auth') === 'true';
    let localNotifications = [];
    let audioEnabled = false;
    let isInitialLoad = true;
    let audioCtx = null;

    window.onload = () => {
      updateAdminUI();
      fetchNotifications();
      // Requirement 5: Poll every 30 seconds
      setInterval(fetchNotifications, 30000);
    };

    // --- SOUND ENGINE ---
    function playChime() {
      if (!audioEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        const playTone = (freq, start, duration) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0.25, start);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(start);
          osc.stop(start + duration);
        };

        // Two-tone alert chime (C5 -> G5)
        playTone(523.25, now, 0.2);
        playTone(783.99, now + 0.15, 0.4);
      } catch (e) {
        console.warn("Audio Context blocked:", e);
      }
    }

    function toggleAudioPref(enabled) {
      audioEnabled = enabled;
      if (enabled) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        playChime(); // Play test chime when enabled
      }
    }

    // --- CLOUD SYNC & POLLING ENGINE ---
    async function fetchNotifications() {
      try {
        const response = await fetch(API_URL, {
          method: 'GET',
          headers: { 'X-Bin-Meta': 'false', "X-Master-key": `${X_MASTER_KEY}` }
        });

        if (!response.ok) throw new Error("Cloud fetch failed");
        
        let data = await response.json();
        if (!Array.isArray(data)) data = data.record || [];

        // Check if data changed to fire alert chime
        if (!isInitialLoad && hasDataChanged(data)) {
          playChime();
        }

        localNotifications = data;
        isInitialLoad = false;
        
        document.getElementById('last-sync').innerText = `Synced: ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
        renderFeed();
      } catch (err) {
        document.getElementById('last-sync').innerText = "Offline Mode / Load Fail";
        console.warn("Network issue fetching data:", err);
      }
    }

    function hasDataChanged(newData) {
      if (newData.length !== localNotifications.length) return true;
      for (let i = 0; i < newData.length; i++) {
        if (newData[i].id !== localNotifications[i]?.id || 
            newData[i].updatedAt !== localNotifications[i]?.updatedAt) {
          return true;
        }
      }
      return false;
    }

    async function syncToCloud(updatedList) {
      try {
        const res = await fetch(API_URL, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json', "X-Master-key": `${X_MASTER_KEY}`
          },
          body: JSON.stringify(updatedList)
        });

        if (!res.ok) throw new Error("Save failed");
        
        localNotifications = updatedList;
        renderFeed();
        playChime();
      } catch (e) {
        alert("Failed to sync changes to the cloud. Check internet connection.");
      }
    }

    // --- CRUD OPERATIONS ---
    function submitNotification() {
      if (!isAdmin) return;

      const id = document.getElementById('edit-id').value;
      const title = document.getElementById('input-title').value.trim();
      const body = document.getElementById('input-body').value.trim();

      if (!title || !body) {
        alert("Please enter both a title and details.");
        return;
      }

      let updatedList = [...localNotifications];

      if (id) {
        // EDIT EXISTING
        const idx = updatedList.findIndex(n => n.id === id);
        if (idx !== -1) {
          updatedList[idx] = {
            ...updatedList[idx],
            title,
            body,
            updatedAt: new Date().toISOString(),
            isEdited: true
          };
        }
      } else {
        // CREATE NEW
        const newRecord = {
          id: Date.now().toString(),
          title,
          body,
          updatedAt: new Date().toISOString(),
          isEdited: false
        };
        updatedList.push(newRecord);
      }

      resetForm();
      syncToCloud(updatedList);
    }

    function editNotification(id) {
      const item = localNotifications.find(n => n.id === id);
      if (!item) return;

      document.getElementById('edit-id').value = item.id;
      document.getElementById('input-title').value = item.title;
      document.getElementById('input-body').value = item.body;

      document.getElementById('form-title').innerText = "Edit Announcement";
      document.getElementById('cancel-edit-btn').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteNotification(id) {
      updatedList.splice(id, 1);
      resetForm();
      syncToCloud(updatedList);
    }
    
    function resetForm() {
      document.getElementById('edit-id').value = '';
      document.getElementById('input-title').value = '';
      document.getElementById('input-body').value = '';
      document.getElementById('form-title').innerText = "Post New Announcement";
      document.getElementById('cancel-edit-btn').classList.add('hidden');
    }

    // --- AUTHENTICATION ---
    function toggleAuthModal() {
      if (isAdmin) {
        isAdmin = false;
        //localStorage.removeItem('tkd_admin_auth');
        document.getElementById('login-modal').classList.toggle('hidden');
        updateAdminUI();
        renderFeed();
      } else {
        // isAdmin = false;
        // localStorage.removeItem('tkd_admin_auth');
        document.getElementById('login-modal').classList.toggle('hidden');
        updateAdminUI();
        renderFeed();
      }
    }

    function loginAdmin() {
      const pwd = document.getElementById('admin-password').value;
      if (pwd === ADMIN_PASSWORD) {
        isAdmin = true;
        // localStorage.setItem('tkd_admin_auth', 'true');
        document.getElementById('admin-password').value = '';
        toggleAuthModal();
        isAdmin = true;
        updateAdminUI();
        renderFeed();
      } else {
        alert("Incorrect password.");
      }
    }

    function updateAdminUI() {
      const authBtn = document.getElementById('auth-btn');
      const adminForm = document.getElementById('admin-form-container');
      const adminBadge = document.getElementById('admin-badge');

      if (isAdmin) {
        authBtn.innerText = "Logout Admin";
        adminForm.classList.remove('hidden');
        adminBadge.classList.remove('hidden');
        adminBadge.classList.add('flex');
      } else {
        authBtn.innerText = "Admin Login";
        adminForm.classList.add('hidden');
        adminBadge.classList.add('hidden');
        adminBadge.classList.remove('flex');
      }
    }

    // --- UI RENDER ENGINE ---
    function renderFeed() {
      const feed = document.getElementById('feed-scroll');
      
      // Sort: Newest -> Oldest
      const sorted = [...localNotifications].sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));

      if (sorted.length === 0) {
        feed.innerHTML = `<div class="bg-white p-6 rounded-xl text-center text-slate-400">No announcements posted yet.</div>`;
        return;
      }

      feed.innerHTML = sorted.map(item => {
        const dateStr = new Date(item.updatedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        
        return `
          <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 ${item.isEdited ? 'border-amber-500' : 'border-slate-800'} transition hover:shadow-md">
            <div class="flex justify-between items-start gap-2 mb-1">
              <h3 class="font-bold text-slate-900 text-base sm:text-lg">${escapeHtml(item.title)}</h3>
              <div class="flex items-center gap-1.5 shrink-0">
                ${item.isEdited ? '<span class="bg-amber-100 text-amber-800 text-[10px] font-bold px-1.5 py-0.5 rounded">EDITED</span>' : ''}
                <span class="text-xs font-semibold text-slate-400">${dateStr}</span>
              </div>
            </div>
            <p class="text-slate-700 text-sm whitespace-pre-wrap leading-relaxed">${escapeHtml(item.body)}</p>
            ${isAdmin ? `
              <div class="mt-3 pt-2 border-t border-slate-100 flex justify-end">
                <button onclick="editNotification('${item.id}')" class="text-xs font-bold text-amber-600 hover:text-amber-700 bg-amber-50 hover:bg-amber-100 px-2.5 py-1 rounded transition">
                  Edit
                </button>
                <button onclick="deleteNotification('${item.id}')" class="text-xs font-bold text-amber-600 hover:text-amber-700 bg-amber-50 hover:bg-amber-100 px-2.5 py-1 rounded transition">
                  Delete
                </button>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }
  </script>
</body>
</html>
