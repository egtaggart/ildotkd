<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TKD Tournament Announcements</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-slate-900 text-white shadow-md border-b-4 border-red-600">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl sm:text-2xl font-black tracking-wider uppercase flex items-center gap-2">
        <span>🥋</span> TKD Tournament Board
      </h1>
      <button id="auth-btn" onclick="toggleAuthModal()" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-md font-semibold text-xs sm:text-sm transition">
        Admin Login
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl w-full mx-auto p-4 flex-grow flex flex-col gap-4">

    <!-- Controls Bar -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-wrap justify-between items-center gap-3">
      <label class="inline-flex items-center gap-3 cursor-pointer select-none">
        <input type="checkbox" id="audio-toggle" onchange="toggleAudioPref(this.checked)" class="sr-only peer">
        <div class="relative w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-red-600"></div>
        <span class="font-bold text-sm sm:text-base text-gray-700 flex items-center gap-1.5">
          <span>🔔</span> Audio Alerts
        </span>
      </label>

      <div id="admin-badge" class="hidden items-center gap-2 bg-red-100 text-red-800 px-3 py-1 rounded-full font-bold text-xs">
        <span class="w-2 h-2 rounded-full bg-red-600 animate-pulse"></span> Admin Mode
      </div>
    </div>

    <!-- Admin Announcement Form (Hidden by default) -->
    <div id="admin-form-container" class="hidden bg-white p-5 rounded-xl shadow-md border-l-4 border-red-600 mb-2">
      <h2 id="form-title" class="text-lg font-bold mb-3 text-slate-900">Post New Announcement</h2>
      <input type="hidden" id="edit-id" value="">
      
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Title / Ring Info</label>
          <input type="text" id="input-title" placeholder="e.g., Ring 4 - Junior Sparring" class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Details</label>
          <textarea id="input-body" rows="3" placeholder="e.g., Calling Divisions 14-16 to staging area..." class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none"></textarea>
        </div>
        <div class="flex gap-2">
          <button onclick="submitNotification()" class="bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-2 rounded-lg text-sm transition">
            Publish
          </button>
          <button id="cancel-edit-btn" onclick="resetForm()" class="hidden bg-gray-500 hover:bg-gray-600 text-white font-bold px-4 py-2 rounded-lg text-sm transition">
            Cancel Edit
          </button>
        </div>
      </div>
    </div>

    <!-- Scrollable Feed -->
    <div class="flex-grow flex flex-col">
      <h2 class="text-md font-bold uppercase text-gray-500 mb-2 tracking-wider">Live Announcements</h2>
      <div id="feed-scroll" class="overflow-y-auto max-h-[60vh] pr-1 space-y-3">
        <!-- Announcements render here dynamically -->
      </div>
    </div>
  </main>

  <!-- Login Modal -->
  <div id="login-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex justify-center items-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl p-6 w-full max-w-sm">
      <h3 class="text-lg font-bold mb-4">Admin Authentication</h3>
      <input type="password" id="admin-password" placeholder="Enter Admin Password" class="w-full p-2.5 border border-gray-300 rounded-lg mb-4 focus:ring-2 focus:ring-red-500 focus:outline-none">
      <div class="flex justify-end gap-2">
        <button onclick="toggleAuthModal()" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-lg text-sm font-semibold">Cancel</button>
        <button onclick="loginAdmin()" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-sm font-semibold">Login</button>
      </div>
    </div>
  </div>

  <script>
    // --- Application State ---
    let authToken = localStorage.getItem('tkd_admin_token') || null;
    let localNotifications = [];
    let audioEnabled = false;
    let isInitialLoad = true;

    // Web Audio API context
    let audioCtx = null;

    // Initial setup
    window.onload = () => {
      updateAdminUI();
      fetchNotifications();
      // Requirement 5: Polling every 30 seconds
      setInterval(fetchNotifications, 30000);
    };

    // Synthesize alert chime (No external MP3 required)
    function playChime() {
      if (!audioEnabled) return;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const now = audioCtx.currentTime;
        const playNote = (freq, start, duration) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0.2, start);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(start);
          osc.stop(start + duration);
        };

        // Two-tone bell alert (High E6 -> High A6)
        playNote(1318.51, now, 0.25);
        playNote(1760.00, now + 0.15, 0.45);
      } catch (e) {
        console.warn("Audio Context error:", e);
      }
    }

    function toggleAudioPref(enabled) {
      audioEnabled = enabled;
      if (enabled && (!audioCtx || audioCtx.state === 'suspended')) {
        // Unlock Web Audio context via user action
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        playChime(); // Short test tone
      }
    }

    // --- API Interactions ---
    async function fetchNotifications() {
      try {
        const response = await fetch('/api/notifications');
        const data = await response.json();

        // Detect updates or new records to trigger sound
        if (!isInitialLoad && hasNewOrUpdatedData(data)) {
          playChime();
        }

        localNotifications = data;
        isInitialLoad = false;
        renderFeed();
      } catch (err) {
        console.error("Failed to fetch notifications", err);
      }
    }

    function hasNewOrUpdatedData(newData) {
      if (newData.length !== localNotifications.length) return true;
      for (let i = 0; i < newData.length; i++) {
        if (newData[i].id !== localNotifications[i]?.id || 
            newData[i].updatedAt !== localNotifications[i]?.updatedAt) {
          return true;
        }
      }
      return false;
    }

    async function submitNotification() {
      const id = document.getElementById('edit-id').value;
      const title = document.getElementById('input-title').value.trim();
      const body = document.getElementById('input-body').value.trim();

      if (!title || !body) {
        alert("Please provide both a title and notification details.");
        return;
      }

      const method = id ? 'PUT' : 'POST';
      const url = id ? `/api/notifications/${id}` : '/api/notifications';

      try {
        const res = await fetch(url, {
          method: method,
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
          },
          body: JSON.stringify({ title, body })
        });

        if (res.ok) {
          resetForm();
          await fetchNotifications();
        } else {
          alert("Action failed. Ensure you are logged in as admin.");
        }
      } catch (e) {
        alert("Network error.");
      }
    }

    // --- Authentication UI Flow ---
    function toggleAuthModal() {
      if (authToken) {
        // Logout
        authToken = null;
        localStorage.removeItem('tkd_admin_token');
        updateAdminUI();
        renderFeed();
      } else {
        document.getElementById('login-modal').classList.toggle('hidden');
      }
    }

    async function loginAdmin() {
      const password = document.getElementById('admin-password').value;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await res.json();
        if (data.success) {
          authToken = data.token;
          localStorage.setItem('tkd_admin_token', authToken);
          document.getElementById('admin-password').value = '';
          toggleAuthModal();
          updateAdminUI();
          renderFeed();
        } else {
          alert("Invalid Admin Password");
        }
      } catch (e) {
        alert("Authentication failed.");
      }
    }

    function updateAdminUI() {
      const authBtn = document.getElementById('auth-btn');
      const adminForm = document.getElementById('admin-form-container');
      const adminBadge = document.getElementById('admin-badge');

      if (authToken) {
        authBtn.innerText = "Logout Admin";
        adminForm.classList.remove('hidden');
        adminBadge.classList.remove('hidden');
        adminBadge.classList.add('flex');
      } else {
        authBtn.innerText = "Admin Login";
        adminForm.classList.add('hidden');
        adminBadge.classList.add('hidden');
        adminBadge.classList.remove('flex');
      }
    }

    function editNotification(id) {
      const notif = localNotifications.find(n => n.id === id);
      if (!notif) return;

      document.getElementById('edit-id').value = notif.id;
      document.getElementById('input-title').value = notif.title;
      document.getElementById('input-body').value = notif.body;

      document.getElementById('form-title').innerText = "Edit Announcement";
      document.getElementById('cancel-edit-btn').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById('edit-id').value = '';
      document.getElementById('input-title').value = '';
      document.getElementById('input-body').value = '';
      document.getElementById('form-title').innerText = "Post New Announcement";
      document.getElementById('cancel-edit-btn').classList.add('hidden');
    }

    // --- DOM Rendering ---
    function renderFeed() {
      const feed = document.getElementById('feed-scroll');
      
      if (localNotifications.length === 0) {
        feed.innerHTML = `<div class="bg-white p-6 rounded-xl text-center text-gray-400">No announcements posted yet.</div>`;
        return;
      }

      feed.innerHTML = localNotifications.map(item => {
        const dateStr = new Date(item.updatedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        
        return `
          <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 ${item.isEdited ? 'border-amber-500' : 'border-slate-800'} transition hover:shadow-md">
            <div class="flex justify-between items-start gap-2 mb-1">
              <h3 class="font-bold text-slate-900 text-base sm:text-lg">${escapeHtml(item.title)}</h3>
              <div class="flex items-center gap-1.5 shrink-0">
                ${item.isEdited ? '<span class="bg-amber-100 text-amber-800 text-[10px] font-bold px-1.5 py-0.5 rounded">EDITED</span>' : ''}
                <span class="text-xs font-semibold text-gray-400">${dateStr}</span>
              </div>
            </div>
            <p class="text-gray-700 text-sm whitespace-pre-wrap leading-relaxed">${escapeHtml(item.body)}</p>
            ${authToken ? `
              <div class="mt-3 pt-2 border-t border-gray-100 flex justify-end">
                <button onclick="editNotification('${item.id}')" class="text-xs font-bold text-amber-600 hover:text-amber-700 bg-amber-50 hover:bg-amber-100 px-2.5 py-1 rounded transition">
                  Edit
                </button>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }
  </script>
</body>
</html>
